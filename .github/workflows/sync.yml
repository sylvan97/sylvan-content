name: Notify sylvan-canopy of content update

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call revalidate endpoint
        run: |
          curl -s -X POST "${{ secrets.REVALIDATE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"event":"git-update"}'
