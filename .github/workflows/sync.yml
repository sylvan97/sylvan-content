name: Notify sylvan-canopy of content update

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call sylvan-canopy revalidate endpoint
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -e
          curl -sS --fail -X POST "${REVALIDATE_URL}" \
            -H "Authorization: Bearer ${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"event\":\"git-update\",\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\"}"
